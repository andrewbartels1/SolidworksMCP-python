name: Release

# Push a tag like v1.5.0 to publish that version to PyPI, GitHub Releases and
# the MCP Registry. PyPI and the registry both authenticate with this
# workflow's GitHub OIDC identity, so no API tokens are stored as secrets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check the tag matches pyproject.toml, version.py and server.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          vp=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/solidworks_mcp/version.py').read())[1])")
          sj=$(python -c "import json; d=json.load(open('server.json')); print(d['version'], d['packages'][0]['version'])")
          echo "tag=$tag pyproject=$py version.py=$vp server.json=$sj"
          [ "$tag" = "$py" ] && [ "$tag" = "$vp" ] && [ "$sj" = "$tag $tag" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/solidworks-mcp-python/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract this version's CHANGELOG section
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md." > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*

  publish-mcp-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
